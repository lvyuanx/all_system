services:
  all_system:
    image: all_system:${IMAGE_TAG:-latest}
    container_name: all_system_${SERVER_NAME:-default}
    volumes:
      - "${HOST_DATA:-/data/all_system}/${SERVER_NAME:-default}/logs:/app/logs"
      - "${HOST_DATA:-/data/all_system}/${SERVER_NAME:-default}/oss:/app/oss"
      - "${HOST_DATA:-/data/all_system}/${SERVER_NAME:-default}/config.py:/app/main/config.py"
    networks:
      - app-network
    restart: unless-stopped   # 后台运行并自动重启

networks:
  app-network:
    name: app-network
    driver: bridge
    external: true
