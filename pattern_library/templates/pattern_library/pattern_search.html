{% extends "vue_setup_base.html" %}
{% load i18n %}
{% load static %}
{% load simpletags %}

{% block title %}
{{ title }}
{% endblock %}

{% block extra_css %}
<style>
    .search-container {
        display: flex;
        flex-direction: row;
        height: 100%;
        justify-content: space-between;
        align-items: center;
    }

    .search-box {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 38%;
        height: 100%;
    }

    .data-box {
        width: 60%;
        height: 100%;
    }

    .data-pattern {
        width: 100%;
        height: 40%;
        border-radius: 8px;
        border: 1px solid #eee;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
    }

    .data-pattern-item {
        width: 32%;
    }

    .data-pattern-default {
        display: flex;
        justify-content: center;
        align-items: center;
        color: #909399;
    }
</style>
{% endblock %}

{% block content %}
<div id="app">
    <div class="page-container" v-loading="pageData.pageLoading">
        <div class="search-container">
            <div class="search-box">
                <el-form label-width="auto" inline>
                    <el-form-item>
                        <common-image-upload ref="imageRef" v-model="image" :limit="1" />
                    </el-form-item>
                    <el-form-item>
                        <el-button type="primary" @click="onSubmit">搜索</el-button>
                        <el-button @click="onClear">清空</el-button>
                    </el-form-item>
                </el-form>
                <common-table :data="searchResultTable.items" :columns="searchResultTable.columns"
                    :loading="searchResultTable.loading" style="flex: 1;">
                    <template #actions="{ row }">
                        <el-button type="primary" size="small" @click="showDetail(row)">查看详情</el-button>
                    </template>
                </common-table>
            </div>
            <div class="data-box">
                <div class="data-pattern" v-if="searchResultPattern.return_result" v-loading="searchResultPattern.loading">
                    <div class="data-pattern-item">
                        <el-image style="width: 100%; height: 100%" :src="searchResultPattern?.main_image?.url"
                            :preview-src-list="[searchResultPattern?.main_image?.url]" fit="cover" />
                    </div>
                    <div class="data-pattern-item">
                        
                    </div>
                    <div class="data-pattern-item"></div>
                </div>
                <div class="data-pattern data-pattern-default" v-else><span>暂无数据</span></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script type="module">
    import CommonImageUpload from "{% static 'vue/js/CommonImageUpload.js' %}";
    import CommonTable from "{% static 'vue/js/CommonTable.js' %}"
    import useHideUploadButton from "{% static 'vue/js/useHideUploadButton.js' %}";
    const { reactive, onMounted, ref, watch, inject } = Vue;
    window.createApp({
        components: { CommonImageUpload, CommonTable },
        setup() {

            /** 父页面弹窗 */
            const ElMessage = inject("ElMessage");

            /** 返回上级菜单 */
            const goBack = () => {
                window.location.href = "{% get_previous_url %}"
            };

            /** 页面数据 */
            const pageData = reactive({
                pageLoading: true,
            });

            // ---------------------- 初始化页面 ----------------------

            /** 异步初始化页面 */
            const asyncInit = async () => {
                pageData.pageLoading = false;
            };

            onMounted(() => {
                asyncInit();
            });

            // ---------------------- search 表单 ----------------------
            const image = ref([])
            const imageRef = ref(null)
            // 自动隐藏上传按钮
            useHideUploadButton(imageRef, image, 1);

            // 提交表单
            const onSubmit = async () => {
                if (image.value.length === 0) {
                    ElMessage.error('请上传图片');
                    return
                }
                try {
                    searchResultTable.loading = true
                    const fd = new FormData()

                    fd.append('file', image.value[0].raw)

                    const res = await request.post("/common/image_search/search", fd)
                    for (const item of res) {
                        item.score = (item.score * 100).toFixed(2) + "%"
                    }
                    searchResultTable.items = res

                } finally {
                    searchResultTable.loading = false
                }
            };

            const onClear = () => {
                searchResultTable.items = []
                image.value = []
                searchResultPattern.return_result = false
            }


            // ---------------------- 搜索结果表格 ----------------------
            const searchResultTable = reactive({
                items: [
                ],
                columns: [
                    { prop: "url", label: "图片", type: "image", align: "center", width: 220, height: 220 },
                    { prop: "score", label: "相似度", align: "center" },
                ],
                loading: false,
            })
            const showDetail = async (row) => {
                searchResultPattern.loading = true
                try{
                    const res = await request.get("/pattern_library/pattern_search", { filename: row.original_name })
                    if (!res) {
                        ElMessage.warning("未找到板式信息！")
                        return
                    }
                    searchResultPattern.code = res.code
                    searchResultPattern.memo = res.memo
                    searchResultPattern.is_active = res.is_active
                    searchResultPattern.tags = res.tags
                    searchResultPattern.main_image = res.main_image
                    searchResultPattern.images = res.images
                    searchResultPattern.return_result = true
                } finally {
                    searchResultPattern.loading = false
                }

            }

            // ---------------------- 搜索结果板式信息 ----------------------
            const searchResultPattern = reactive({
                loading: true,
                return_result: false,
                code: "",
                memo: "",
                is_active: true,
                tags: [],
                main_images: null,
                images: []
            })


            return {
                pageData,
                goBack,

                // search 表单
                image,
                imageRef,
                onSubmit,
                onClear,

                // 搜索结果表格
                searchResultTable,
                showDetail,

                // 搜索结果板式信息
                searchResultPattern,


            };
        }
    });
</script>
{% endblock %}
