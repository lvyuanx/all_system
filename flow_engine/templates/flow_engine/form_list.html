{% extends "vue_setup_base.html" %}
{% load i18n %}
{% load static %}
{% load simpletags %}

{% block title %}
{{ title }}
{% endblock %}

{% block extra_css %}
<style>
    #app > .page-container {
        overflow: hidden;
        padding: 8px;
    }
</style>
{% endblock %}

{% block content %}
<div id="app">
    <div class="page-header">
        <el-page-header title="{% trans 'Back' %}" @back="goBack" content="{{title}}"></el-page-header>
        <div class="header-right">
            <el-button @click="goFlowList">流程列表</el-button>
        </div>
    </div>
    <div class="page-container" v-loading="pageData.pageLoading">
        <common-table
            :data="pageData.tableData"
            :columns="pageData.columns"
            :loading="pageData.loading"
            :border="true"
            :actions-width="220"
            :filterForm="pageData.filterForm"
            @update:filterForm="onFilterUpdate"
            @page-change="onFilterSearch"
        >
            <template #filter="{ model }">
                <el-form-item label="关键词">
                    <el-input v-model="model.keyword" placeholder="流程编码/名称" clearable />
                </el-form-item>
                <el-form-item label="状态">
                    <el-select v-model="model.is_active" clearable style="width: 120px">
                        <el-option label="启用" :value="1" />
                        <el-option label="禁用" :value="0" />
                    </el-select>
                </el-form-item>
            </template>

            <template #actions="{ row }">
                <el-button link type="primary" @click="openFormDesigner(row)">表单设计</el-button>
                <el-button link type="success" @click="openFlowDesigner(row)">流程设计</el-button>
            </template>
        </common-table>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script type="module">
    import CommonTable from "{% static 'vue/js/CommonTable.js' %}";
    const { reactive, onMounted } = Vue;

    window.createApp({
        components: { CommonTable },
        setup() {
            const goBack = () => {
                window.location.href = "{% get_previous_url %}";
            };

            const pageData = reactive({
                pageLoading: true,
                loading: false,
                filterForm: {
                    keyword: "",
                    is_active: null,
                },
                columns: [
                    { prop: "code", label: "编码", width: 180 },
                    { prop: "name", label: "名称", minWidth: 280 },
                    { prop: "version", label: "版本", width: 100 },
                    { prop: "is_active", label: "启用", width: 90 },
                    { prop: "update_time_str", label: "更新时间", minWidth: 220 },
                ],
                tableData: [],
            });

            const loadList = async (filters = null) => {
                pageData.loading = true;
                try {
                    const query = filters || pageData.filterForm;
                    const res = await request.get("/flow_engine/flow_definition_page_list", query);
                    pageData.tableData = res || [];
                } finally {
                    pageData.loading = false;
                }
            };

            const onFilterUpdate = (val) => {
                pageData.filterForm = val;
            };

            const onFilterSearch = async (payload) => {
                await loadList(payload?.filters || pageData.filterForm);
            };

            const openFormDesigner = (row) => {
                if (!row?.flow_id) return;
                window.location.href = `/admin/flow_engine/definition/${row.flow_id}/form_designer/`;
            };

            const openFlowDesigner = (row) => {
                if (!row?.flow_id) return;
                window.location.href = `/admin/flow_engine/definition/${row.flow_id}/change/`;
            };

            const goFlowList = () => {
                window.location.href = "/admin/flow_engine/definition/list/";
            };

            onMounted(async () => {
                await loadList();
                pageData.pageLoading = false;
            });

            return {
                goBack,
                pageData,
                onFilterUpdate,
                onFilterSearch,
                openFormDesigner,
                openFlowDesigner,
                goFlowList,
            };
        },
    });
</script>
{% endblock %}
