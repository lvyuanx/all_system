<div id="mfuWidget_{{ field_name }}" class="mfu-widget">

<style>
.mfu-container { display: flex; flex-wrap: wrap; gap: 10px; }
.mfu-box { position: relative; width: 180px; height: 180px;
    border: 2px dashed #dcdfe6; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; background-size: cover;
    background-position: center; background-repeat: no-repeat; }
.mfu-box:hover { border-color: #409eff; }
.mfu-box::before { content: "+"; position: absolute; font-size: 48px; color: #ccc; z-index:0; }
.mfu-box.has-image::before { content: ""; }

.mfu-overlay { position: absolute; z-index: 1; inset: 0;
    background: rgba(0,0,0,0.5); opacity: 0;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    transition: opacity 0.2s; flex-direction: column; }
.mfu-box.has-image:hover .mfu-overlay { opacity: 1; }

.mfu-overlay button { padding: 6px 8px; font-size: 12px; border:none;
    border-radius: 4px; color: #fff; cursor: pointer; }
.mfu-btn-preview { background: #409eff !important; }
.mfu-btn-delete { background: #f56c6c !important; }
.mfu-btn-upload { background: #e6a23c !important; }

.mfu-file-input { display: none; }

.mfu-preview-modal { position: fixed; z-index: 1000; inset: 0;
    background: rgba(0,0,0,0.9); display: flex;
    align-items: center; justify-content: center; opacity: 0;
    pointer-events: none; transition: opacity 0.2s; }
.mfu-preview-modal.active { opacity: 1; pointer-events: auto; }
.mfu-preview-modal img { width: 75vw; height: 75vh; object-fit: contain; }
</style>

<!-- 保存图片顺序 -->
<input type="hidden" id="mfuHidden_{{ field_name }}" name="{{ field_name }}_values">
<!-- 保存被删除图片 -->
<input type="hidden" id="mfuDeleted_{{ field_name }}" name="images_deleted">

<div class="mfu-container" id="mfuContainer_{{ field_name }}">
    <div class="mfu-box" id="mfuAddBox_{{ field_name }}">
        <input type="file" id="mfuInput_{{ field_name }}" multiple accept="image/*" class="mfu-file-input">
    </div>
</div>

<div class="mfu-preview-modal" id="mfuPreview_{{ field_name }}">
    <img id="mfuPreviewImg_{{ field_name }}">
</div>

<script>
(function(){
    const container = document.querySelector("#mfuContainer_{{ field_name }}");
    const addBox = document.querySelector("#mfuAddBox_{{ field_name }}");
    const input = document.querySelector("#mfuInput_{{ field_name }}");
    const hiddenInput = document.querySelector("#mfuHidden_{{ field_name }}");
    const deletedInput = document.querySelector("#mfuDeleted_{{ field_name }}");
    const previewModal = document.querySelector("#mfuPreview_{{ field_name }}");
    const previewImg = document.querySelector("#mfuPreviewImg_{{ field_name }}");

    const MAX_COUNT = {{ max_count|default:3 }};
    const ALLOWED_EXTS = {{ allowed_exts|default:"['jpg','png','jpeg']"|safe }};
    const MAX_SIZE = {{ max_size_mb|default:5 }} * 1024*1024;

    const existingImages = {{ field_value|default:"[]"|safe }};
    existingImages.forEach(url => addImageBox(url, null, true));

    function addImageBox(url, file=null, isOld=false){
        const box = document.createElement("div");
        box.className = "mfu-box has-image";
        box.style.backgroundImage = `url('${url}')`;

        if(isOld) box.dataset.old = "true";

        // 每张图片独立 input
        const eachInput = document.createElement("input");
        eachInput.type = "file";
        eachInput.name = "{{ field_name }}";
        eachInput.className = "mfu-file-input";
        if(file){
            const dt = new DataTransfer();
            dt.items.add(file);
            eachInput.files = dt.files;
        }
        box.appendChild(eachInput);

        const overlay = document.createElement("div");
        overlay.className = "mfu-overlay";

        const btnUpload = document.createElement("button");
        btnUpload.type = "button"; btnUpload.textContent="上传";
        btnUpload.className="mfu-btn-upload";
        btnUpload.onclick = e => {
            e.stopPropagation();
            eachInput.onchange = ev => {
                const newFile = ev.target.files[0];
                if(!newFile) return;

                const ext = newFile.name.split('.').pop().toLowerCase();
                if(!ALLOWED_EXTS.includes(ext)){ alert(`文件类型不允许: ${ext}`); return; }
                if(newFile.size > MAX_SIZE){ alert(`文件大小不可超过 ${MAX_SIZE/1024/1024} MB`); return; }

                const url = URL.createObjectURL(newFile);
                box.style.backgroundImage = `url('${url}')`;
                delete box.dataset.old; // 上传新文件后清除旧文件标记
                syncHiddenField();
            };
            eachInput.click();
        };

        const btnPreview = document.createElement("button");
        btnPreview.type = "button"; btnPreview.textContent="预览";
        btnPreview.className="mfu-btn-preview";
        btnPreview.onclick = e => {
            e.stopPropagation();
            previewImg.src = box.style.backgroundImage.replace(/^url\(["']?/,"").replace(/["']?\)$/,"");
            previewModal.classList.add("active");
        };

        const btnDelete = document.createElement("button");
        btnDelete.type = "button"; btnDelete.textContent="删除";
        btnDelete.className="mfu-btn-delete";
        btnDelete.onclick = e => {
            e.stopPropagation();
            if(box.dataset.old){
                const deletedUrls = JSON.parse(deletedInput.value || "[]");
                const bgUrl = box.style.backgroundImage.replace(/^url\(["']?/,"").replace(/["']?\)$/,"");
                deletedUrls.push(bgUrl);
                deletedInput.value = JSON.stringify(deletedUrls);
            }
            box.remove();
            syncHiddenField();
            updateAddBox();
        };

        overlay.append(btnUpload, btnPreview, btnDelete);
        box.appendChild(overlay);

        container.insertBefore(box, addBox);
        syncHiddenField();
        updateAddBox();
    }

    function syncHiddenField(){
        const urls = [...container.querySelectorAll(".mfu-box.has-image")]
            .map(box => box.style.backgroundImage.replace(/^url\(["']?/,"").replace(/["']?\)$/,""));
        hiddenInput.value = JSON.stringify(urls);
    }

    function updateAddBox(){
        const count = container.querySelectorAll(".mfu-box.has-image").length;
        addBox.style.display = (count >= MAX_COUNT) ? "none" : "flex";
    }

    addBox.addEventListener("click", () => input.click());

    input.addEventListener("change", e => {
        let files = Array.from(e.target.files);
        const existCount = container.querySelectorAll(".mfu-box.has-image").length;
        if(existCount + files.length > MAX_COUNT)
            files = files.slice(0, MAX_COUNT - existCount);

        files.forEach(file=>{
            const ext = file.name.split('.').pop().toLowerCase();
            if(!ALLOWED_EXTS.includes(ext)){ alert(`文件类型不允许: ${ext}`); return; }
            if(file.size > MAX_SIZE){ alert(`文件大小不可超过 ${MAX_SIZE/1024/1024} MB`); return; }

            const url = URL.createObjectURL(file);
            addImageBox(url, file);
        });
    });

    previewModal.addEventListener("click", ()=> previewModal.classList.remove("active"));
})();
</script>
</div>
